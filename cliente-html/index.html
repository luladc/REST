<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Elecciones - Personas</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div id="seccion-login" class="contenedor">
        <h2>Iniciar Sesión</h2>
        <form id="form-login">
            <div class="campo">
                <label>Correo electrónico:</label>
                <input type="email" id="login-email" required>
            </div>
            <div class="campo">
                <label>Contraseña:</label>
                <input type="password" id="login-password" required>
            </div>
            <button type="submit" class="btn-primario">Ingresar</button>
            <p id="mensaje-login" class="mensaje-error"></p>
        </form>
    </div>

    <div id="seccion-crud" class="contenedor-ancho" style="display: none;">
        <div class="barra-superior">
            <div>
                <h3>Gestión de Personas</h3>
                <span id="info-usuario"></span>
            </div>
            <button id="btn-logout" class="btn-peligro">Cerrar Sesión</button>
        </div>

        <div class="formulario-persona">
            <h4 id="titulo-formulario">Registrar Persona</h4>
            <form id="form-persona">
                <input type="hidden" id="persona-id">
                <div class="fila">
                    <div class="campo">
                        <label>CI:</label>
                        <input type="text" id="persona-ci" required>
                    </div>
                    <div class="campo">
                        <label>Nombres:</label>
                        <input type="text" id="persona-nombres" required>
                    </div>
                    <div class="campo">
                        <label>Apellidos:</label>
                        <input type="text" id="persona-apellidos" required>
                    </div>
                </div>
                <div class="fila">
                    <div class="campo">
                        <label>Fecha de Nacimiento:</label>
                        <input type="date" id="persona-fecha" required>
                    </div>
                    <div class="campo">
                        <label>Teléfono:</label>
                        <input type="text" id="persona-telefono">
                    </div>
                </div>
                <div class="botones-form">
                    <button type="submit" class="btn-primario" id="btn-guardar">Guardar</button>
                    <button type="button" class="btn-secundario" id="btn-cancelar" style="display: none;">Cancelar</button>
                </div>
            </form>
        </div>

        <h4>Lista de Personas Registradas</h4>
        <table class="tabla">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>CI</th>
                    <th>Nombres</th>
                    <th>Apellidos</th>
                    <th>Fecha Nac.</th>
                    <th>Teléfono</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-personas">
            </tbody>
        </table>
    </div>

    <script src="app.js"></script>
</body>
</html>
